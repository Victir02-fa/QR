<style>
/* Layout: una columna estilo iOS. Título grande, tira de la semana, anillos concéntricos, lista agrupada; barra de pestañas fija abajo.
   Tema único oscuro (estilo app Actividad de Apple), elegido por el usuario. */
:root {
  --bg: #000000;
  --surface: #1C1C1E;
  --surface-2: #2C2C2E;
  --surface-3: #3A3A3C;
  --surface-4: #636366;
  --line: #38383A;
  --fg: #FFFFFF;
  --fg-2: #AEAEB2;
  --fg-3: #6E6E73;
  --accent: #0A84FF;
  --good: #30D158;
  --bad: #FF453A;
  --gold: #FFD60A;
  --cell-off: #141416;
  --cell-fail: #2C2C2E;
  --heat-1: rgba(255, 255, 255, 0.16);
  --heat-2: rgba(255, 255, 255, 0.36);
  --heat-3: rgba(255, 255, 255, 0.62);
  --heat-4: #FFFFFF;
  --bar-bg: rgba(22, 22, 24, 0.84);
  --scrim: rgba(0, 0, 0, 0.62);
  --shadow: rgba(0, 0, 0, 0.55);
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
html.locked, html.locked body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-text); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
input, textarea { font: inherit; font-size: 17px; color: var(--fg); background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tab-n, .tabnum { font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(100px + env(safe-area-inset-bottom, 0px)); }
#view { display: flex; flex-direction: column; gap: 20px; }

/* Encabezado tipo "large title" */
.lt { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 6px; }
.lt-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); }
h1 { font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-weight: 800; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 20px; line-height: 1.2; font-weight: 800; margin: 0; text-wrap: balance; }
.pill-btn { font-size: 15px; font-weight: 600; color: var(--accent); padding: 7px 14px; background: var(--surface); border-radius: 999px; white-space: nowrap; }
.muted { color: var(--fg-2); }
.small { font-size: 13px; }

/* Banner de modo ejemplo */
.demo-banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--gold); color: var(--bg); font-weight: 600; font-size: 14px; }
.demo-banner button { background: var(--bg); color: var(--gold); padding: 6px 12px; border-radius: 999px; font-weight: 700; white-space: nowrap; }

/* Semana */
.week { display: grid; grid-template-columns: 20px repeat(7, minmax(0, 1fr)) 20px; align-items: center; gap: 2px; margin-inline: -6px; }
.wk-nav { height: 44px; font-size: 26px; line-height: 1; color: var(--fg-2); }
.wk-nav:disabled { opacity: .2; }
.wk-day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; border-radius: 12px; min-width: 0; }
.wk-day:disabled { opacity: .35; }
.wk-l { font-size: 11px; font-weight: 600; color: var(--fg-3); }
.wk-day svg { width: 34px; height: 34px; display: block; }
.wk-n { font-size: 13px; font-weight: 700; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.wk-day.today .wk-n { color: var(--bad); }
.wk-day.sel .wk-n { background: var(--fg); color: var(--bg); }
.wk-day.sel.today .wk-n { background: var(--bad); color: var(--fg); }

/* Resumen con anillos */
.summary { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.big { width: min(232px, 64vw); max-width: 100%; aspect-ratio: 1; }
.big svg { width: 100%; height: 100%; display: block; }
.big.celebrate svg { animation: pop .9s cubic-bezier(.2, .9, .3, 1.4); }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.07); } 100% { transform: scale(1); } }
.sum-n { font-family: var(--font-display); font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 10px; }
.sum-n small { font-size: 17px; color: var(--fg-2); font-weight: 700; }
.sum-sub { font-size: 15px; color: var(--fg-2); text-align: center; }
.legend-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; color: var(--fg-2); margin-top: 6px; }
.legend-row i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.rp { transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); }

/* Tarjeta de contexto (mañana / noche / motivos pendientes) */
.ctx { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; row-gap: 3px; }
.ctx-ico { font-size: 26px; line-height: 1.1; grid-row: span 3; }
.ctx-t { font-weight: 700; font-size: 17px; }
.ctx-p { color: var(--fg-2); font-size: 15px; }
.ctx-a { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.btn-s { font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: var(--surface-2); color: var(--fg); }
.btn-s.accent { background: var(--accent); }

/* Lista de hábitos */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 16px; overflow: hidden; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; padding: 10px 12px; position: relative; }
.hrow + .hrow::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; border-top: .5px solid var(--line); }
.hmain { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 2px 0; text-align: left; }
.hring { position: relative; width: 44px; height: 44px; flex: none; }
.hring svg { width: 44px; height: 44px; display: block; }
.hicon { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; }
.htext { display: flex; flex-direction: column; min-width: 0; }
.hname { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hsub { font-size: 14px; color: var(--hc); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow.pre .hsub, .hrow.fail .hsub { color: var(--fg-3); }
.hctl { display: flex; align-items: center; gap: 8px; }
.chk { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--surface-3); display: grid; place-items: center; color: var(--surface-3); transition: background .2s, border-color .2s, color .2s, transform .15s; }
.chk svg { width: 20px; height: 20px; }
.chk.on { background: var(--hc); border-color: var(--hc); color: var(--bg); }
.chk:active, .stp:active { transform: scale(.92); }
.stp { min-width: 44px; height: 38px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; transition: transform .15s; }
.stp:disabled { opacity: .3; }
.stp.minus { background: var(--surface-2); color: var(--fg-2); min-width: 38px; padding: 0; font-size: 22px; line-height: 1; }
.stp.plus { background: var(--hc); color: var(--bg); }
.hrow.done .stp.plus { background: var(--surface-2); color: var(--hc); }
.why { grid-column: 1 / -1; justify-self: start; margin: 6px 0 2px 56px; font-size: 13px; font-weight: 600; color: var(--gold); background: var(--surface-2); padding: 5px 11px; border-radius: 999px; }
.why.set { color: var(--fg-2); }
.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Tarjetas genéricas */
.card { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-h h2 { font-size: 19px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi b { font-family: var(--font-display); font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--fg-2); }
.delta { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }

/* Hallazgos */
.ins { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; }
.ins + .ins { border-top: .5px solid var(--line); padding-top: 12px; }
.ins-i { font-size: 24px; line-height: 1.15; grid-row: span 2; }
.ins-t { font-weight: 700; font-size: 16px; }
.ins-t .tag { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.tag.bad { background: var(--bad); color: var(--fg); }
.tag.good { background: var(--good); color: var(--bg); }
.ins-p { color: var(--fg-2); font-size: 15px; }

/* Barras */
.hbar { display: grid; grid-template-columns: 28px minmax(0, 1fr) 48px; align-items: center; gap: 10px; }
.hbar > span:first-child { font-size: 20px; text-align: center; }
.hb-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.hb-top { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.hb-top span:first-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar > b { text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; display: flex; flex-direction: column; align-items: flex-end; }
.track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; background: var(--c); }
.streak { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; font-size: 15px; }
.streak > span:first-child { font-size: 20px; text-align: center; }
.streak .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.streak b { font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }

/* Gráfica por día de la semana */
.wdc { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; height: 160px; }
.wdc-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.wdc-area { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.wdc-bar { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--surface-3); min-height: 3px; }
.wdc-col.worst .wdc-bar { background: var(--bad); }
.wdc-col.best .wdc-bar { background: var(--good); }
.wdc-v { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.wdc-l { font-size: 12px; font-weight: 700; color: var(--fg-3); }

/* Calendario mensual */
.mon-head { display: flex; align-items: center; justify-content: space-between; }
.mon-head h2 { text-transform: capitalize; }
.nav-b { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); font-size: 22px; color: var(--fg-2); }
.nav-b:disabled { opacity: .25; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 2px; }
.cal-l { text-align: center; font-size: 12px; font-weight: 700; color: var(--fg-3); padding-bottom: 2px; }
.cal-d { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; border-radius: 10px; min-width: 0; }
.cal-d svg { width: 100%; max-width: 42px; height: auto; aspect-ratio: 1; display: block; }
.cal-n { font-size: 12px; font-weight: 700; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.cal-d.today .cal-n { color: var(--bad); }
.cal-d.perfect .cal-n { color: var(--gold); }
.cal-d:disabled { opacity: .3; }

/* Controles segmentados y chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); padding: 2px; border-radius: 10px; }
.seg button { padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--fg-2); text-align: center; }
.seg button.on { background: var(--surface-3); color: var(--fg); }
.sheet .seg { background: var(--surface-2); }
.sheet .seg button.on { background: var(--surface-4); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { padding: 8px 13px; border-radius: 999px; background: var(--surface-2); font-size: 15px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--chip, var(--fg)); color: var(--bg); font-weight: 700; }
#view > .chips .chip { background: var(--surface); }
#view > .chips .chip.on { background: var(--chip, var(--fg)); }

/* Mapa de calor */
.heat-scroll { overflow-x: auto; margin-inline: -16px; padding: 4px 16px 6px; scrollbar-width: none; }
.heat-scroll::-webkit-scrollbar { display: none; }
.heat { display: grid; grid-template-rows: 14px repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; width: max-content; }
.heat.mini { grid-template-rows: repeat(7, 12px); }
.hm { font-size: 10px; font-weight: 700; color: var(--fg-3); white-space: nowrap; text-transform: capitalize; line-height: 14px; }
.hc { display: block; width: 12px; height: 12px; border-radius: 3px; background: var(--cell-off); }
.hc.fail { background: var(--cell-fail); }
.hc.fut { background: transparent; }
.hc.l1 { background: var(--heat-1); } .hc.l2 { background: var(--heat-2); } .hc.l3 { background: var(--heat-3); } .hc.l4 { background: var(--heat-4); }
.hc.today { box-shadow: inset 0 0 0 1.5px var(--fg-2); }
.heat-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--fg-2); align-items: center; }
.heat-legend .hc { display: inline-block; vertical-align: -2px; margin-right: 5px; }

/* Ajustes: listas agrupadas */
.group-t { font-size: 13px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; margin: 0 4px -12px; }
.group { background: var(--surface); border-radius: 14px; overflow: hidden; }
.gi { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 52px; position: relative; }
.gi + .gi::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--line); }
.gi-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: none; }
.gi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; }
.gi-main > span:first-child { overflow-wrap: anywhere; }
.gi-sub { font-size: 13px; color: var(--fg-2); }
.gi-btn { color: var(--accent); font-weight: 600; }
.gi-mv { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); color: var(--fg-2); font-size: 15px; flex: none; }
.gi-mv:disabled { opacity: .25; }
.chev { color: var(--fg-3); font-size: 20px; }
.gi input[type="time"] { width: auto; padding: 6px 10px; font-size: 17px; }
.gi p { margin: 0; }
details.howto { padding: 0 14px 14px; color: var(--fg-2); font-size: 15px; }
details.howto summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 12px 0 4px; list-style: none; }
details.howto summary::-webkit-details-marker { display: none; }
details.howto ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
details.howto code { color: var(--fg); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 14px; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); }
.sync.saved::before, .sync.idle::before { background: var(--good); }
.sync.saving::before { background: var(--gold); }
.sync.error::before, .sync.offline::before { background: var(--bad); }
.foot { text-align: center; font-size: 12px; color: var(--fg-3); padding: 4px 0 8px; }

/* Hoja inferior (sheet) */
.sheet { position: fixed; inset: 0; z-index: 50; }
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s; }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 20px); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
.sheet.open .sheet-scrim { opacity: 1; }
.sheet.open .sheet-panel { transform: none; }
.sheet-grab { width: 38px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 0 auto 12px; }
#sheet-body { display: flex; flex-direction: column; gap: 18px; }
.sh-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sh-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.sh-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; }
.sh-x { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); color: var(--fg-2); font-size: 14px; flex: none; text-align: center; }
.sec-l { font-size: 13px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: -8px; }
.big-num { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center; gap: 8px; }
.big-num .stp { height: 64px; min-width: 64px; font-size: 28px; border-radius: 50%; }
.bn { text-align: center; }
.bn-v { display: block; font-family: var(--font-display); font-size: 52px; font-weight: 900; line-height: 1; color: var(--hc); font-variant-numeric: tabular-nums; }
.bn-g { color: var(--fg-2); font-size: 15px; }
.num-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.num-form button { padding: 0 18px; border-radius: 10px; background: var(--surface-3); font-weight: 600; }
.toggle-big { width: 100%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 700; background: var(--surface-2); color: var(--fg); display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; }

  /* ================= Hallazgos automáticos ("en qué fallé") ================= */

  /* ================= SVG: anillos ================= */

    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-act'), hid = el.getAttribute('data-h'), h = hid ? habitById(hid) : null;
    var k = el.getAttribute('data-k') || S.selected, t = todayKey();
    if (WRITES[a] && !S.loaded) { toast('Cargando tus datos…'); return; }
    switch (a) {
      case 'tab': {
        var v = el.getAttribute('data-v');
        if (v === S.view && v === 'hoy') S.selected = t;
        if (v === 'hist' && S.view !== 'hist') S.histMonth = ymOf(S.selected);
        S.view = v; window.scrollTo(0, 0); render(); break;
      }
      case 'day': S.selected = k; render(); break;
      case 'go-today': S.selected = t; render(); break;
      case 'week': S.selected = minK(addDays(S.selected, Number(el.getAttribute('data-d'))), t); render(); break;
      case 'toggle': if (h) { changeVal(h, S.selected, getVal(h.id, S.selected) >= 1 ? 0 : 1); } break;
      case 'inc': if (h) changeVal(h, S.selected, getVal(h.id, S.selected) + h.step); break;
      case 'dec': if (h) changeVal(h, S.selected, Math.max(0, getVal(h.id, S.selected) - h.step)); break;
      case 'quick': if (h) { var q = el.getAttribute('data-v'); changeVal(h, S.selected, q === 'goal' ? Math.max(getVal(h.id, S.selected), goalOn(h, S.selected)) : q === 'zero' ? 0 : getVal(h.id, S.selected) + Number(q)); } break;
      case 'detail': if (h) openSheet({ type: 'detail', h: h.id }); break;
      case 'why': if (h) openSheet({ type: 'reasons', entries: [{ k: k, h: h.id }] }); break;
      case 'reasons-day': openSheet({ type: 'reasons', entries: habitsForDay(k).filter(function (x) { return status(x, k) === 'fail'; }).map(function (x) { return { k: k, h: x.id }; }) }); break;
      case 'reasons-pending': openSheet({ type: 'reasons', entries: pendingReasons(7) }); break;
      case 'reasons-today': openSheet({ type: 'reasons', entries: activeHabits().filter(function (x) { return status(x, t) === 'pending'; }).map(function (x) { return { k: t, h: x.id }; }) }); break;
      case 'reason': if (h) { var r = el.getAttribute('data-r'); setReason(h, k, getReason(h.id, k) === r ? null : r); render(); renderSheet(); } break;
      case 'sheet-close': closeSheet(); break;
      case 'hist-mode': S.histMode = el.getAttribute('data-v'); render(); break;
      case 'hist-month': { var nm = addMonths(S.histMonth, Number(el.getAttribute('data-d'))); if (nm <= ymOf(t)) S.histMonth = nm; render(); break; }
      case 'hist-habit': S.histHabit = hid || 'all'; render(); break;
      case 'cal-day': S.selected = k; S.view = 'hoy'; window.scrollTo(0, 0); render(); break;
      case 'new-habit': openEdit(null); break;
      case 'edit-habit': if (h) openEdit(h); break;
      case 'draft-icon': readDraft(); S.sheet.draft.icon = el.getAttribute('data-v'); renderSheet(); break;
      case 'draft-color': readDraft(); S.sheet.draft.color = el.getAttribute('data-v'); renderSheet(); break;
      case 'draft-type': readDraft(); S.sheet.draft.type = el.getAttribute('data-v'); renderSheet(); break;
      case 'archive': { var ha = habitById(S.sheet.id); if (ha) { ha.archivedAt = t; saveConfig(); closeSheet(); render(); toast('Hábito archivado'); } break; }
      case 'del-ask': readDraft(); S.sheet.confirmDelete = true; renderSheet(); break;
      case 'del-cancel': S.sheet.confirmDelete = false; renderSheet(); break;
      case 'del-confirm': { var c = cfg(), id = S.sheet.id; c.habits = c.habits.filter(function (x) { return x.id !== id; }); saveConfig(); closeSheet(); render(); toast('Hábito borrado'); break; }
      case 'restore': if (h) { delete h.archivedAt; saveConfig(); render(); toast('Hábito restaurado'); } break;
      case 'move': if (h) {
        var list = cfg().habits, act = activeHabits(), i = act.indexOf(h), j = i + Number(el.getAttribute('data-d'));
        if (j >= 0 && j < act.length) { var ia = list.indexOf(h), ib = list.indexOf(act[j]); list[ia] = act[j]; list[ib] = h; saveConfig(); render(); }
      } break;
      case 'export-copy': copyText(exportJSON(), 'Respaldo copiado. Pégalo en Notas para guardarlo.'); break;
      case 'export-dl': downloadBackup(); break;
      case 'import-open': openSheet({ type: 'import', text: '' }); break;
      case 'imp-check': { var ta = document.getElementById('imp-text'); S.sheet.text = ta ? ta.value : ''; var res = parseBackup(S.sheet.text); S.sheet.error = res.error || ''; S.sheet.parsed = res.parsed || null; renderSheet(); break; }
      case 'imp-cancel': S.sheet.parsed = null; renderSheet(); break;
      case 'imp-apply': if (S.sheet && S.sheet.parsed) { applyImport(S.sheet.parsed); closeSheet(); render(); toast('Respaldo importado'); } break;
      case 'demo-on': S.demoDocs = buildDemo(); S.demo = true; S.selected = t; window.scrollTo(0, 0); render(); toast('Modo ejemplo activado'); break;
      case 'demo-off': S.demo = false; S.demoDocs = null; S.selected = t; window.scrollTo(0, 0); render(); break;
    }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'edit-form') return saveEdit();
    if (e.target.id === 'num-form') {
      var inp = document.getElementById('num-input'), n = parseFloat(String(inp.value).replace(',', '.'));
      var h = S.sheet && habitById(S.sheet.h);
      if (!h || !(n >= 0)) { toast('Escribe un número'); return; }
      if (!S.loaded) { toast('Cargando tus datos…'); return; }
      inp.blur(); changeVal(h, S.selected, n); renderSheet();
    }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'set-morning' || id === 'set-night') {
      var v = e.target.value; if (!/^\d{2}:\d{2}$/.test(v)) return;
      cfg().settings[id === 'set-morning' ? 'morning' : 'night'] = v; saveConfig(); render(); toast('Horario guardado');
    }
    if (id === 'imp-file' && e.target.files && e.target.files[0]) {
      var f = e.target.files[0], rd = new FileReader();
      rd.onload = function () { if (!S.sheet || S.sheet.type !== 'import') return; S.sheet.text = String(rd.result || ''); var res = parseBackup(S.sheet.text); S.sheet.error = res.error || ''; S.sheet.parsed = res.parsed || null; renderSheet(); };
      rd.onerror = function () { if (S.sheet) { S.sheet.error = 'No se pudo leer el archivo.'; renderSheet(); } };
      rd.readAsText(f);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(); });

  /* ================= Arranque ================= */
  function start(data) {
    if (isObj(data)) {
      ['view', 'selected', 'histMode', 'histMonth', 'histHabit'].forEach(function (key) { if (typeof data[key] === 'string') S[key] = data[key]; });
      if (['hoy', 'hist', 'ana', 'aj'].indexOf(S.view) < 0) S.view = 'hoy';
      if (!DATE_RE.test(S.selected) || S.selected > todayKey()) S.selected = todayKey();
      if (!/^\d{4}-\d{2}$/.test(S.histMonth)) S.histMonth = ymOf(todayKey());
    }
    render();
    Store.init();
    var lastToday = todayKey(), lastBand = band();
    var tick = function () {
      var t = todayKey(), b = band();
      if (t !== lastToday) { if (S.selected === lastToday) S.selected = t; lastToday = t; render(); }
      else if (b !== lastBand && S.view === 'hoy') render();
      lastBand = b;
    };
    setInterval(tick, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  }
  var hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return { view: S.view, selected: S.selected, histMode: S.histMode, histMonth: S.histMonth, histHabit: S.histHabit }; }); } catch (e) {}
  if (hot && typeof hot.ready === 'function') { try { hot.ready(start); } catch (e) { start({}); } }
  else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
